<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to Mehdi’s personal website.">
  <title>Mehdi | Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f5f0; color: #21352b; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 640px; padding: clamp(28px, 7vw, 64px); background: white; border: 1px solid #dde5dc; border-radius: 24px; }
    .label { color: #526b5a; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { font-size: clamp(40px, 9vw, 64px); line-height: 1.08; letter-spacing: -.045em; margin: 24px 0; }
    p { font-size: 18px; line-height: 1.65; color: #526057; }
    a { display: inline-block; margin-top: 16px; padding: 13px 20px; border-radius: 10px; background: #244d38; color: white; text-decoration: none; font-weight: 600; }
    a:hover { background: #183b29; }
    a:focus-visible { outline: 3px solid #ab7826; outline-offset: 4px; }
    footer { margin-top: 40px; font-size: 13px; color: #657269; }
  </style>
</head>
<body>
  <main>
    <div class="label">My little corner of the internet</div>
    <h1>Hello, I’m Mehdi.</h1>
    <p>Welcome to my website. This is a simple starting point for sharing my projects, ideas, and things I’m learning.</p>
    <a href="https://github.com/mshadkhah">Find me on GitHub &rarr;</a>
    <footer>More coming soon.</footer>
  </main>
</body>
</html>
